<style>
:root{
  --field:#4E7834;      /* loader ground, from the logo green */
  --sprout:#E6F2C4;     /* young-rice wordmark */
  --ink:#1D3113;
  --paddy:#537D39;
  --sky-top:#CFE3B0;
  --sky-low:#F1F5DF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--sky-low);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
*{box-sizing:border-box}

/* ---------- hero (placeholder for the scroll video) ---------- */
.hero{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,var(--sky-top) 0%,var(--sky-low) 55%);
  transform-origin:50% 50%}
.hero svg.terraces{position:absolute;left:0;right:0;bottom:0;width:100%;height:38%}
.hero nav{position:absolute;top:calc(env(safe-area-inset-top,0px) + 24px);left:clamp(20px,4vw,48px);right:clamp(20px,4vw,48px);
  display:flex;justify-content:space-between;align-items:center}
.hero nav svg{height:22px;width:auto}
.hero nav a{color:var(--ink);font-weight:600;font-size:15px;text-decoration:none;padding:8px 2px;border-bottom:1.5px solid currentColor}
.copy{position:absolute;left:50%;top:clamp(90px,17vh,170px);transform:translateX(-50%);width:min(92vw,720px);text-align:center}
.copy h1{margin:0;font-weight:700;font-size:clamp(40px,7.2vw,92px);line-height:.98;letter-spacing:-.03em}
.copy p{margin:20px auto 0;max-width:30em;font-size:clamp(16px,1.6vw,19px);line-height:1.5;color:#3C5530}
.join{margin:28px auto 0;display:flex;gap:8px;max-width:440px;background:#fff;border-radius:999px;padding:6px;
  box-shadow:0 1px 0 rgba(29,49,19,.08),0 12px 30px -12px rgba(29,49,19,.35)}
.join input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;padding:0 16px;color:var(--ink)}
.join input:focus{outline:none}
.join button{border:0;border-radius:999px;background:var(--paddy);color:#fff;font:inherit;font-weight:600;font-size:15px;padding:13px 20px;cursor:pointer;white-space:nowrap}
.join:focus-within{outline:2px solid var(--ink);outline-offset:3px}
.join button:focus-visible,.replay:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- loader ---------- */
#loader{position:fixed;inset:0;z-index:10;pointer-events:none}
#loader svg{width:100%;height:100%;display:block}
.guide{fill:none;stroke:var(--sprout);stroke-width:1;stroke-opacity:.45;vector-effect:non-scaling-stroke;
  stroke-dasharray:1;stroke-dashoffset:1}
.letter path{fill:var(--sprout);fill-opacity:0;stroke:var(--sprout);stroke-width:1;vector-effect:non-scaling-stroke;
  stroke-dasharray:1;stroke-dashoffset:1}
.mark path{fill:var(--sprout);fill-opacity:0;transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.grain{position:fixed;inset:0;z-index:11;pointer-events:none;opacity:.14;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}

.replay{position:fixed;z-index:20;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  border:1px solid rgba(29,49,19,.25);background:rgba(255,255,255,.7);backdrop-filter:blur(6px);color:var(--ink);
  font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;cursor:pointer;opacity:0;transition:opacity .4s}
.replay.show{opacity:1}
@media (max-width:560px){.copy{top:18%}.join{flex-direction:column;border-radius:20px}.join input{padding:12px 14px}}
</style>

<script>
(() => {
  const ANCHOR = {x:327.33, y:41.43};   // centre of the g's counter: the portal
  const COUNTER_R = 16.36;
  const world = document.getElementById('world');
  const hole = document.getElementById('hole');
  const loader = document.getElementById('loader');
  const hero = document.getElementById('hero');
  const grain = document.getElementById('grain');
  const replay = document.getElementById('replay');
  const guides = [...document.querySelectorAll('.guide')];
  const marks = [...document.querySelectorAll('.mark path')];
  const letters = [...document.querySelectorAll('.letter')];
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let anims = [], raf = 0, zooming = false, zoomStart = 0;
  const T = {guides:0, mark:350, outline:550, fill:1350, clean:1650, zoom:2550, zoomDur:950};

  function baseScale(){
    const w = innerWidth, h = innerHeight;
    const target = w < 600 ? w*0.8 : Math.min(w*0.52, 820);
    return Math.min(target/651.45, (h*0.3)/84.42);
  }
  function place(s){
    world.setAttribute('transform',
      `translate(${innerWidth/2} ${innerHeight/2}) scale(${s}) translate(${-ANCHOR.x} ${-ANCHOR.y})`);
  }
  const A = (el, kf, opt) => { const a = el.animate(kf, {fill:'both', ...opt}); anims.push(a); return a; };

  function reset(){
    anims.forEach(a => a.cancel()); anims = [];
    cancelAnimationFrame(raf); zooming = false;
    loader.style.display = ''; grain.style.opacity = '';
    hole.setAttribute('fill-opacity', 0);
    hero.style.transform = 'scale(1.14)'; hero.style.filter = 'blur(6px)';
    replay.classList.remove('show');
    place(baseScale());
  }

  function run(){
    reset();
    if (reduce){
      A(loader, [{opacity:1},{opacity:0}], {duration:500, delay:300});
      hero.style.transform = ''; hero.style.filter = '';
      setTimeout(finish, 850); return;
    }
    const ease = 'cubic-bezier(.65,0,.35,1)';

    // 1. construction lines draw in
    guides.forEach((g,i) => A(g, [{strokeDashoffset:1},{strokeDashoffset:0}],
      {duration:750, delay:T.guides + i*45, easing:ease}));

    // 2. the four stalks sprout from the ground, then each letter traces its outline
    marks.forEach((m,i) => A(m, [{transform:'scaleY(0)', fillOpacity:.25},{transform:'scaleY(1)', fillOpacity:.25}],
      {duration:700, delay:T.mark + i*90, easing:'cubic-bezier(.2,.9,.25,1)'}));
    letters.forEach((l,i) => l.querySelectorAll('path').forEach(p =>
      A(p, [{strokeDashoffset:1},{strokeDashoffset:0}], {duration:800, delay:T.outline + i*70, easing:ease})));

    // 3. fill left to right: translucent first, then solid; outlines retire
    const fillKF = [{fillOpacity:0},{fillOpacity:.3, offset:.45},{fillOpacity:1}];
    marks.forEach((m,i) => A(m, [{fillOpacity:.25},{fillOpacity:1}], {duration:420, delay:T.fill + i*40, composite:'replace'}));
    letters.forEach((l,i) => l.querySelectorAll('path').forEach(p =>
      A(p, fillKF, {duration:480, delay:T.fill + 160 + i*70, easing:'ease-out'})));
    letters.forEach((l,i) => l.querySelectorAll('path').forEach(p =>
      A(p, [{strokeOpacity:1},{strokeOpacity:0}], {duration:400, delay:T.fill + 400 + i*70})));
    A(document.getElementById('guides'), [{opacity:1},{opacity:0}], {duration:550, delay:T.clean});

    // 4. zoom through the g's counter
    setTimeout(() => { zooming = true; zoomStart = performance.now(); raf = requestAnimationFrame(tick); }, T.zoom);
  }

  function tick(now){
    const t = Math.min(1, (now - zoomStart)/T.zoomDur);
    const s0 = baseScale();
    const sEnd = Math.hypot(innerWidth, innerHeight)/2 / COUNTER_R * 1.15;
    const e = t*t*t*(t*(t*6-15)+10) * .35 + Math.pow(t,3) * .65;   // slow start, hard finish
    place(s0 * Math.pow(sEnd/s0, e));
    // portal opens early so the hero is visible inside the counter while we travel
    hole.setAttribute('fill-opacity', Math.min(1, t/0.22));
    const k = Math.min(1, t*1.1);
    hero.style.transform = `scale(${1.14 - 0.14*k})`;
    hero.style.filter = `blur(${6*(1-k)}px)`;
    if (t < 1) raf = requestAnimationFrame(tick); else finish();
  }

  function finish(){
    zooming = false;
    loader.style.display = 'none';
    grain.style.opacity = '0';
    hero.style.transform = ''; hero.style.filter = '';
    setTimeout(() => replay.classList.add('show'), 400);
  }

  addEventListener('resize', () => { if (!zooming && loader.style.display !== 'none') place(baseScale()); });
  replay.addEventListener('click', run);
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(() => requestAnimationFrame(run));
})();
</script>
</body>
