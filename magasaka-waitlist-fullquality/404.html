<style>
:root{--ink:#141414;--bg:#eee1d8;--font:"Inter Display","Inter",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font);letter-spacing:-.005em;-webkit-font-smoothing:antialiased;overflow:hidden}
.page{position:fixed;inset:0;overflow:hidden}
.stage{position:absolute;inset:0;z-index:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:manipulation}
.stage canvas:focus-visible{outline:none}
/* a soft veil from the top so the logo and headline read over the fields */
.page::after{content:"";position:absolute;left:0;right:0;top:0;height:18%;z-index:1;pointer-events:none;
  background:linear-gradient(180deg,rgba(238,225,216,.85) 0%,rgba(238,225,216,0) 100%)}
.page::before{content:"";position:absolute;left:0;right:0;bottom:0;height:12%;z-index:1;pointer-events:none;
  background:linear-gradient(0deg,rgba(20,24,14,.3) 0%,rgba(20,24,14,0) 100%)}
header{position:absolute;left:0;top:0;z-index:2;padding:calc(env(safe-area-inset-top,0px) + 30px) clamp(20px,3.3vw,50px) 0}
.logo{display:inline-block;width:154px;height:20px;color:var(--ink)}
.logo svg{display:block;width:100%;height:100%}
.logo svg path[fill]{fill:currentColor}
.logo:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:6px}
/* the same split as the home page: Magasaka's own hand for letters, Indie Flower only for punctuation and spaces */
@font-face{font-family:'Magasaka Hand';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/magasaka-hand.otf) format('opentype');
  unicode-range:U+0041-005A,U+0061-007A}
@font-face{font-family:'Magasaka Hand';font-style:normal;font-weight:400;font-display:swap;src:url(/fonts/indie-flower-latin.woff2) format('woff2');
  unicode-range:U+0020-0040,U+005B-0060,U+007B-007E,U+00A0-00FF,U+2010-2027}
/* a handwritten note off to the side of the paddy, its arrow pointing at the 404 */
.head{position:absolute;left:0;top:0;z-index:2;display:flex;align-items:flex-end;gap:2px;pointer-events:none;color:#fff;
  opacity:0;transition:opacity .8s ease 1.2s;transform:translateY(-50%) rotate(-4deg);transform-origin:left center}
.head.is-placed{opacity:.95}
h1{margin:0;font:400 clamp(24px,2.1vw,30px)/1.1 'Magasaka Hand','Segoe Print','Bradley Hand',cursive;letter-spacing:0;white-space:nowrap;
  text-shadow:0 1px 10px rgba(0,0,0,.45),0 0 2px rgba(0,0,0,.25)}
.arrow{flex:none;filter:drop-shadow(0 1px 4px rgba(0,0,0,.35))}
.arrow--side{width:62px;height:46px;margin-bottom:10px}
.arrow--down{display:none}
.head.is-on-top{flex-direction:column;align-items:flex-start;transform:translate(-30%,-100%) rotate(-3deg)}
.head.is-on-top .arrow--side{display:none}
.head.is-on-top .arrow--down{display:block;width:40px;height:48px;margin:2px 0 0 26px;order:2}
@media (prefers-reduced-motion: reduce){.head{transition:none}}
@media (max-aspect-ratio: 1/1){
  h1{font-size:23px}
}
</style>

  <div class="stage">
    <canvas id="plot" tabindex="0" role="img" aria-label="Page not found: the number 404 planted in rice seedlings in a flooded paddy. Click, tap or press Enter to plant another."></canvas>
  </div>

</div>
<script>
  if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)){
    document.querySelectorAll('[data-home]').forEach(a => a.href = '/magasaka-waitlist.html');
    document.querySelectorAll('[data-home-hash]').forEach(a => a.href = '/magasaka-waitlist.html' + a.dataset.homeHash);
  }

  // The paddy photo (made on Higgsfield) with real seedling cut-outs planted on it in perspective: the water area is
  // mapped with a homography, "404" goes in row by row from the far bund, the seedlings sway in the wind, lean away
  // from the pointer and show in the water's reflection; a tap plants another with a ripple.
  (() => {
    const cv = document.getElementById('plot'), g = cv.getContext('2d');
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SHEET = {h: 300, frames: [[0, 288], [292, 272], [568, 331], [903, 301], [1208, 307], [1519, 240], [1763, 302], [2069, 284]]};
    // the water's corners in the photo, as fractions of its width and height: far-left, far-right, near-right, near-left
    // two framings of the same scene: wide for landscape screens, tall for phones held upright
    const TALL = matchMedia('(max-aspect-ratio: 1/1)').matches;
    const Q = TALL ? [[.242, .296], [.780, .296], [.918, .714], [.082, .714]] : [[.363, .174], [.615, .174], [.747, .872], [.249, .872]];
    const photo = new Image(), sheet = new Image();
    photo.src = TALL ? '/images/404/farm-tall.webp' : '/images/404/farm.webp'; sheet.src = '/images/404/seedlings.webp';
    let W = 0, H = 0, dpr = 1, raf = 0, visible = true, ready = 0, planted = 0, dx = 0, dy = 0, dw = 0, dh = 0;
    const seeds = [], ripples = [], mouse = {x: -9999, y: -9999};

    // unit square (u across, v from far to near) -> the water quad, with true perspective
    let M = null, Minv = null;
    function homography(p){
      const [x0, y0] = p[0], [x1, y1] = p[1], [x2, y2] = p[2], [x3, y3] = p[3];
      const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3, dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
      const den = dx1 * dy2 - dy1 * dx2, gg = (dx3 * dy2 - dy3 * dx2) / den, hh = (dx1 * dy3 - dy1 * dx3) / den;
      return [x1 - x0 + gg * x1, x3 - x0 + hh * x3, x0, y1 - y0 + gg * y1, y3 - y0 + hh * y3, y0, gg, hh, 1];
    }
    function invert(m){
      const [a, b, c, d, e, f, g2, h, i] = m, A = e * i - f * h, B = -(d * i - f * g2), C = d * h - e * g2;
      const det = a * A + b * B + c * C;
      return [A / det, -(b * i - c * h) / det, (b * f - c * e) / det, B / det, (a * i - c * g2) / det, -(a * f - c * d) / det, C / det, -(a * h - b * g2) / det, (a * e - b * d) / det];
    }
    const apply = (m, x, y) => { const w = m[6] * x + m[7] * y + m[8]; return [(m[0] * x + m[1] * y + m[2]) / w, (m[3] * x + m[4] * y + m[5]) / w]; };
    let nearW = 1;
    function proj(u, v){
      const [x, y] = apply(M, u, v), [xa] = apply(M, 0, v), [xb] = apply(M, 1, v);
      return {x, y, s: (xb - xa) / nearW};
    }
    function layout(){
      const r = cv.getBoundingClientRect(); dpr = Math.min(devicePixelRatio || 1, 2);
      W = r.width; H = r.height; cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      const iw = photo.naturalWidth || (TALL ? 1000 : 2200), ih = photo.naturalHeight || (TALL ? 1768 : 943), k = Math.max(W / iw, H / ih);
      dw = iw * k; dh = ih * k; dx = (W - dw) / 2; dy = (H - dh) * (TALL ? .5 : .62);
      M = homography(Q.map(([x, y]) => [dx + x * dw, dy + y * dh])); Minv = invert(M);
      nearW = apply(M, 1, 1)[0] - apply(M, 0, 1)[0];
      // the note: beside the right-hand bund on wide screens (arrow pointing in at the 404), above the plot on tall ones
      const tag = document.querySelector('.head');
      if (tag){
        if (TALL){ const [tx, ty] = apply(M, .58, -.04); tag.classList.add('is-on-top'); tag.style.left = tx + 'px'; tag.style.top = ty + 'px'; }
        else { const [tx, ty] = apply(M, 1, .3); tag.classList.remove('is-on-top'); tag.style.left = (tx + 34) + 'px'; tag.style.top = ty + 'px'; }
        tag.classList.add('is-placed');
      }
    }

    const rnd = (a, b) => a + Math.random() * (b - a);
    function seed(u, v, born){ return {u, v, born, f: Math.random() * SHEET.frames.length | 0, h: rnd(.85, 1.15), flip: Math.random() < .5, ph: rnd(0, 6.28), lean: rnd(-.05, .05)}; }
    function plant404(){
      // each digit drawn on its own with a clear gap, and stretched tall to make up for the field's foreshortening;
      // set in the middle-to-near part of the paddy, where rows are far enough apart to read
      const off = document.createElement('canvas'); off.width = 640; off.height = 380;
      const o = off.getContext('2d');
      o.textAlign = 'center'; o.textBaseline = 'middle'; o.font = '900 224px "Inter Display","Inter",Arial,sans-serif';
      o.save(); o.scale(1, 1.55);
      [['4', 112], ['0', 320], ['4', 528]].forEach(([c, x]) => o.fillText(c, x, 124));
      o.restore();
      const d = o.getImageData(0, 0, 640, 380).data, pts = [], sx = 14, sy = 12;
      for (let y = 4; y < 380; y += sy) for (let x = 4; x < 640; x += sx)
        if (d[(y * 640 + x) * 4 + 3] > 120) pts.push({u: .08 + x / 640 * .84 + rnd(-.003, .003), v: .14 + y / 380 * .86 + rnd(-.003, .003)});
      pts.sort((a, b) => a.v - b.v || a.u - b.u);
      const now = performance.now() + 400;
      pts.forEach((p, i) => seeds.push(seed(p.u, p.v, reduce ? 0 : now + i * 9)));
    }

    function drawSeed(sd, now){
      const grow = reduce ? 1 : Math.min(1, Math.max(0, (now - sd.born) / 700));
      if (grow <= 0) return;
      const e = 1 - Math.pow(1 - grow, 3);
      const p = proj(sd.u, sd.v), [fx, fw] = SHEET.frames[sd.f];
      const hpx = nearW * .056 * p.s * sd.h * e, wpx = hpx * fw / SHEET.h;
      const dx = p.x - mouse.x, dy = (p.y - hpx * .5) - mouse.y, dist = Math.hypot(dx, dy);
      const push = dist < 110 ? (1 - dist / 110) * Math.sign(dx || 1) * .35 : 0;
      const wind = reduce ? 0 : Math.sin(now * .0014 + sd.u * 6 + sd.v * 3 + sd.ph) * .07 + Math.sin(now * .0037 + sd.ph) * .02;
      const skew = sd.lean + wind + push;
      // reflection: mirrored, squashed and faint, a little wobbly
      g.save(); g.globalAlpha = .22 * e; g.translate(p.x, p.y);
      g.transform(sd.flip ? -1 : 1, 0, -skew * .6, -.42, 0, 0);
      g.drawImage(sheet, fx, 0, fw, SHEET.h, -wpx / 2, -hpx, wpx, hpx); g.restore();
      // where the stems go into the water
      g.fillStyle = 'rgba(70,55,38,.28)'; g.beginPath(); g.ellipse(p.x, p.y, wpx * .16, wpx * .05, 0, 0, 6.28); g.fill();
      g.save(); g.translate(p.x, p.y + 1);
      g.transform(sd.flip ? -1 : 1, 0, skew, 1, 0, 0);
      g.drawImage(sheet, fx, 0, fw, SHEET.h, -wpx / 2, -hpx, wpx, hpx); g.restore();
    }

    function frame(now){
      raf = 0;
      if (!ready) return;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.drawImage(photo, dx, dy, dw, dh);
      for (let i = ripples.length - 1; i >= 0; i--){
        const r = ripples[i], k = (now - r.t) / 1300;
        if (k >= 1){ ripples.splice(i, 1); continue; }
        const p = proj(r.u, r.v), rad = (6 + k * 46) * p.s;
        g.strokeStyle = `rgba(255,250,240,${.65 * (1 - k)})`; g.lineWidth = 1.4;
        g.beginPath(); g.ellipse(p.x, p.y, rad, rad * .32, 0, 0, 6.28); g.stroke();
        if (k > .15){ g.beginPath(); g.ellipse(p.x, p.y, rad * .6, rad * .19, 0, 0, 6.28); g.stroke(); }
      }
      seeds.sort((a, b) => a.v - b.v);
      for (const s of seeds) drawSeed(s, now);
      if (!reduce && visible) raf = requestAnimationFrame(frame);
    }
    const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };

    function plantAt(u, v){
      const now = performance.now();
      seeds.push(seed(u, v, now)); ripples.push({u, v, t: now}); planted++;
      kick();
    }
    cv.addEventListener('pointerdown', e => {
      if (!Minv) return;
      const r = cv.getBoundingClientRect(), [u, v] = apply(Minv, e.clientX - r.left, e.clientY - r.top);
      if (u > .02 && u < .98 && v > .02 && v < .98) plantAt(u, v);
    });
    cv.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); plantAt(rnd(.08, .92), rnd(.1, .95)); } });
    cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(); mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; kick(); });
    cv.addEventListener('pointerleave', () => { mouse.x = mouse.y = -9999; kick(); });

    new ResizeObserver(() => { layout(); kick(); }).observe(cv);
    matchMedia('(max-aspect-ratio: 1/1)').addEventListener('change', () => location.reload());
    new IntersectionObserver(([en]) => { visible = en.isIntersecting; if (visible) kick(); }).observe(cv);
    document.addEventListener('visibilitychange', () => { visible = !document.hidden; if (visible) kick(); });
    layout();
    Promise.all([photo.decode(), sheet.decode(), document.fonts ? document.fonts.ready : 0]).then(() => { ready = 1; layout(); plant404(); kick(); }).catch(() => { ready = 1; kick(); });
  })();
</script>
